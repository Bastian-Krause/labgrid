name: reusable unit tests

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: true
      branch:
        type: string
        required: false
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-26.04
    continue-on-error: false
    steps:
    - name: Free Runner Space
      uses: justinthelaw/maximize-github-runner-space@v0.10.0
      with:
        # keep `rust`: packages built from git with maturin (ruff, …) need a
        # toolchain, and letting maturin bootstrap its own is slow and fragile
        skip-components: cached-python,cached-pypy,android,rust
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch }}
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: true
    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # git-wheels-index caches, restored/saved as a pair.
    #
    # Split restore/save (instead of plain actions/cache) on purpose: that action
    # only saves on job success (`post-if: success()`), and these runs are expected
    # to fail while the dependency dev branches are being shaken out — which is
    # exactly when we most want to keep the wheels already built.
    #
    #   wheels/    the tool's own cache, keyed by <project>/<commit-sha>/<wheel-tag>
    #              — a cached wheel is served with no probe, no build, no clone
    #   pip-cache/ where every build's pip/uv cache is redirected (--cache-dir);
    #              pip caches wheels built from immutable git SHAs here
    #
    # A partial set from a failed run is still valid, because entries are keyed by
    # commit: unchanged upstream HEAD == reuse, moved HEAD == rebuild.
    - name: Restore git-wheels-index caches
      uses: actions/cache/restore@v4
      with:
        path: |
          .git-wheels-index/wheels
          .git-wheels-index/pip-cache
        # run_attempt too: re-running a failed job keeps the same run_id, and cache
        # keys are immutable — without it the re-run's wheels would be discarded
        key: gwi-wheels-${{ inputs.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: gwi-wheels-${{ inputs.python-version }}-

    - name: Install system dependencies
      run: |
        sudo apt-get install -yq libow-dev openssh-server openssh-client graphviz openocd
        sudo mkdir -p /var/cache/labgrid/runner && sudo chown runner /var/cache/labgrid/runner
    - name: Prepare local SSH
      run: |
        # the default of 777 is too open for SSH
        chmod 755 ~
        ssh-keygen -f ~/.ssh/id_ed25519.local -t ed25519 -N ""
        cat ~/.ssh/id_ed25519.local.pub >> ~/.ssh/authorized_keys
        echo -e "Host localhost ip6-localhost\n  Hostname 127.0.0.1\n  IdentityFile ~/.ssh/id_ed25519.local\n  UserKnownHostsFile ~/.ssh/known_hosts.local" >> ~/.ssh/config
        ssh -o StrictHostKeyChecking=no localhost echo OK
    - name: Enable unprivileged user namespaces
      run: |
        sudo sysctl kernel.unprivileged_userns_clone=1
        unshare -Un true
    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip virtualenv
    - name: Install labgrid
      run: |
        sudo apt-get install -yq libxml2-dev libxslt1-dev libffi-dev python3-dev
        pipx install uv
        pipx install "git+https://github.com/Bastian-Krause/git-wheels-index.git"
        echo "== compile: =="
        echo ".[dev]" | with-git-wheels-index --python "${{ inputs.python-version }}" --config .github/gwi.toml -- uv pip compile -
        echo "== install: =="
        with-git-wheels-index --python "${{ inputs.python-version }}" --config .github/gwi.toml -- pip install -e ".[dev]"

    # Immediately after the only step that builds wheels. `!cancelled()` rather than
    # `always()` so a cancelled run doesn't upload a half-written cache;
    # continue-on-error so an early failure (nothing built, paths absent) can't turn
    # this into a second, confusing error.
    - name: Save git-wheels-index caches
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: |
          .git-wheels-index/wheels
          .git-wheels-index/pip-cache
        key: gwi-wheels-${{ inputs.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Lint with pylint
      run: |
        pylint --list-msgs-enabled
        pylint labgrid
    - name: Format with ruff
      run: |
        cat $(which ruff)
        # ruff format --check --diff
    - name: Test with pytest
      run: |
        pytest -r a --cov-config .coveragerc --cov=labgrid --junitxml=junit.xml -o junit_family=legacy --local-sshmanager --ssh-username runner -k "not test_docker_with_daemon"
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: ${{ inputs.python-version }}
    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: ${{ inputs.python-version }}
    - name: Build documentation
      run: |
        make -C doc clean
        make -C doc doctest SPHINXOPTS=-W
        make -C doc html SPHINXOPTS=-W
        make -C man clean
        make -C man all
        git --no-pager diff --exit-code
        # check README.rst separately
        pip install rstcheck
        rstcheck --ignore-languages=bash --report-level=WARNING README.rst
