[pytest]
# show skip reasons, do not capture stdout, no caching, specify env, strategy
# transition from scratch
addopts = -ra -s --color=no -p no:cacheprovider --lg-env env.yaml --lg-initial-state unknown

# demo imports labgrid to bind the driver long before pytest exists, so pytest
# cannot rewrite assertions in labgrid's own modules
filterwarnings =
    ignore::pytest.PytestAssertRewriteWarning
