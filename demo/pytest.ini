[pytest]
testpaths = tests
# --lg-env: the argument a real run needs. This page has exactly one config, so
# it belongs here rather than in every invocation -- pytest.main() alone is then
# enough at the prompt, and the conftest's header line keeps what was really
# passed in plain sight instead of buried in this file.
# --lg-initial-state unknown: what a fresh process would hold. Without it the
# strategy still remembers where demo.py left the board and the first transition
# skips as "nothing to do"; with it, labgrid's strategy fixture calls force(),
# and the run really power cycles (transition(barebox) goes through off, and off
# is a QMP stop + system_reset).
# -ra: give the reason behind every non-passing letter, skips included.
# -s: emscripten has no fd redirection to capture through, and test output
# should stream into the page as it happens rather than arrive in one lump.
# --color=no: the REPL pane is HTML, not a terminal -- ANSI escapes would
# arrive as literal garbage rather than as color.
addopts = -ra -s --color=no -p no:cacheprovider --lg-env env.yaml --lg-initial-state unknown
# The page imports labgrid to bind the driver long before pytest exists, so
# pytest cannot rewrite assertions in labgrid's own modules and says so on every
# run. Unavoidable here and harmless -- test modules are still rewritten -- but
# it is noise in a two-line report.
filterwarnings =
    ignore::pytest.PytestAssertRewriteWarning
