# Read-only here. labgrid built this page's Environment from this file at
# startup, and a second one cannot be constructed in the same process -- its
# imports: re-register the strategy in labgrid's global driver factory -- so
# editing it would change nothing that is already running. Reload with the file
# changed on the server to try a different config.
targets:
  main:
    resources:
      # Where the RAUC bundle is "staged" for the guest to stream. There is no
      # real HTTP server here: HTTPProviderDriver.stage() (faked in
      # runtime/python/labgrid_wasm.py) hands the bytes to the page, which serves
      # them over the in-browser proxy at the URL below -- so this is the one URL
      # the guest streams the update from. The host is the in-browser stack's
      # gateway IP (nothing else is served there), reachable from the guest
      # through the proxy; https so it works unchanged on the https GitHub Pages
      # site (http would be mixed content). stage() returns external + "/" + the
      # file's basename, exactly as a real HTTP server's docroot would. On real
      # hardware this is a genuine HTTP server.
      HTTPProvider:
        internal: "/"
        external: "https://192.168.127.1"
    drivers:
      QEMUDriver:
        qemu_bin: qemu_arm
        # highmem=off is load-bearing, not cosmetic: the disk is virtio-blk over
        # PCI (see the -drive below), and the virt board's default high PCIe MMIO
        # window sits at a 40-bit address the armv7 short-descriptor MMU cannot
        # map -- with it on, barebox hangs probing the ECAM host bridge. The
        # kernel and barebox both carry the PCI/ECAM/VIRTIO_PCI drivers for this.
        machine: "virt,highmem=off"
        cpu: cortex-a7
        memory: 128M
        # base=utc gives the guest the real (browser) wall clock, which two cert
        # checks both need to be current: the RAUC bundle signature (keyring
        # valid 2026-2036) and -- since we verify the stream instead of passing
        # --tls-no-verify -- the in-browser proxy's MITM cert, which it mints
        # fresh at page load with NotBefore=now. A pinned date can't satisfy that
        # MITM cert once real time drifts past it, so real time it is. (This is a
        # real YAML comment -- inside the '>' block below, '#' is literal text
        # and would be passed to QEMU as arguments.)
        extra_args: >
          -smp 1
          -rtc base=utc
          -object rng-random,filename=/dev/random,id=rng0
          -device virtio-rng-device,rng=rng0
          -drive if=virtio,format=raw,file=images/mini.hdimg
          -netdev socket,id=vmnic,connect=127.0.0.1:9999
          -device virtio-net-device,netdev=vmnic
          -fsdev local,id=wasm0,path=/.wasmenv,security_model=passthrough
          -device virtio-9p-device,fsdev=wasm0,mount_tag=wasm0
        # The default NIC enumeration trips a wasm g_slist_sort crash, so it
        # stays off and the virtio-net device is named explicitly (tests/netfull.mjs
        # asserts it reaches argv). The socket netdev is bridged to the in-browser
        # network stack over emscripten's WebSocket (Module.websocket); wasm0
        # carries the stack's MITM CA into the guest. See browser-net/.
        nic: none
        flash: barebox_flash
      BareboxDriver:
        prompt: 'barebox@[^:]+:[^ ]+ '
        bootstring: 'commandline:'
        interrupt: "\x04"
        # Covers QEMU-WASM's cold start to the autoboot window on slow machines.
        login_timeout: 180
      ShellDriver:
        prompt: 'root@[\w-]+:[^ ]+ '
        login_prompt: ' login: '
        # ~1 min of emulation-in-wasm on a throttled 4-core test box, with
        # margin for slower machines.
        login_timeout: 300
        username: 'root'
      # Stages the RAUC bundle for the guest (see the HTTPProvider above). The
      # strategy activates it in the off state, so a staged URL is ready before
      # the guest is even powered on.
      HTTPProviderDriver: {}
      QEMUBareboxStrategy: {}
tools:
  qemu_arm: qemu-system-arm
images:
  barebox_flash: images/mini.norimg
  # The update the streaming test installs. The page fetches it into place at
  # boot (with networking on); HTTPProviderDriver.stage() reads it from here.
  rauc_bundle: images/rauc/demo.raucb
imports:
  - qemubareboxstrategy.py
