targets:
  main:
    resources:
      HTTPProvider:
        internal: "/"
        external: "https://192.168.127.1"
      # The guest's address on the in-browser network (the gvisor-tap-vsock
      # stack always leases the single guest .2 behind the .1 gateway). Reads
      # like any static-lease lab config; the SSHDriver connects here.
      NetworkService:
        address: "192.168.127.2"
        username: "root"

    drivers:
      HTTPProviderDriver: {}
      QEMUDriver:
        qemu_bin: "qemu_arm"
        machine: "virt,highmem=off"
        cpu: "cortex-a7"
        memory: "128M"
        extra_args: "-smp 1
          -rtc base=utc
          -object rng-random,filename=/dev/random,id=rng0
          -device virtio-rng-device,rng=rng0
          -drive if=virtio,format=raw,file=images/mini.hdimg
          -netdev socket,id=vmnic,connect=127.0.0.1:9999
          -device virtio-net-device,netdev=vmnic
          -fsdev local,id=wasm0,path=/.wasmenv,security_model=passthrough
          -device virtio-9p-device,fsdev=wasm0,mount_tag=wasm0"
        nic: "none"
        flash: "barebox_flash"
      BareboxDriver:
        prompt: "barebox@[^:]+:[^ ]+ "
        bootstring: "commandline:"
        interrupt: "\x04"
        # margin for slow machines
        login_timeout: 180
      ShellDriver:
        prompt: "root@[\\w-]+:[^ ]+ "
        login_prompt: " login: "
        # margin for slow machines
        login_timeout: 300
        username: "root"
        # Deploy the demo public key to the guest's ~/.ssh/authorized_keys over
        # the serial console at the shell transition, so the SSHDriver can log in
        # with the matching private key. On this read-only rootfs _put_ssh_key
        # takes its bind-mount branch (authorized_keys on tmpfs); see mini-image.bb.
        keyfile: "keys/demo_ed25519.pub"
      SSHDriver:
        # Private key for the master connection. In the browser this SSH rides a
        # virtio-serial port to a dropbear in the guest (labgrid_wasm_ssh backs
        # the stock ssh/scp with asyncssh); on real hardware it would be TCP.
        keyfile: "keys/demo_ed25519"
      QEMUBareboxStrategy: {}

tools:
  qemu_arm: "qemu-system-arm"

images:
  barebox_flash: "images/mini.norimg"
  rauc_bundle: "images/rauc/demo.raucb"

imports:
  - qemubareboxstrategy.py
